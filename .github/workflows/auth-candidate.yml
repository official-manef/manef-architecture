name: Auth candidate diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/auth-candidate.yml'
      - 'src/lib/server/auth/**'
      - 'src/routes/auth/**'
      - 'src/convex/auth.config.ts'

permissions:
  contents: read

concurrency:
  group: auth-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.head_ref == 'fix/workos-login-20261002'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Report formatting-only candidate patch
        run: |
          bunx prettier --write .
          echo FORMAT_PATCH_BEGIN
          git diff --no-ext-diff -- . ':!.github/workflows/auth-candidate.yml'
          echo FORMAT_PATCH_END
      - name: Verify formatted candidate (not a release gate)
        run: bun run verify
      - name: Install browser
        run: bunx playwright install --with-deps chromium
      - name: Browser tests
        run: bun run test:e2e
